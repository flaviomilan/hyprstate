name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Raise the floor as coverage grows, never lower it. ipc.rs and main.rs
      # need a live Hyprland socket, so they're left out of the measurement.
      - run: >
          cargo llvm-cov --locked
          --ignore-filename-regex '(src/main\.rs|src/hyprland/ipc\.rs)$'
          --fail-under-lines 74
          --lcov --output-path lcov.info
      - name: Report
        if: ${{ !cancelled() }}
        run: |
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(src/main\.rs|src/hyprland/ipc\.rs)$' | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
