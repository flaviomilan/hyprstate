name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens or updates the "chore: release" PR with the next version and
  # changelog. Uses a PAT: PRs opened with GITHUB_TOKEN don't run CI, and
  # main requires its checks.
  release-pr:
    name: release PR
    if: github.repository == 'flaviomilan/hyprstate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Once the release PR is merged: publish to crates.io, tag, GitHub release.
  release:
    name: publish
    if: github.repository == 'flaviomilan/hyprstate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.plz.outputs.releases_created }}
      tag: ${{ fromJSON(steps.plz.outputs.releases || '[{}]')[0].tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Called directly: a tag pushed with GITHUB_TOKEN triggers no workflow.
  artifacts:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      publish: true
    secrets: inherit
