name: Bug report
description: Something in hyprstate does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: dry-run
    attributes:
      label: Output
      description: |
        The command output, ideally with `--dry-run` and `-vv`.
        Check it for window titles or paths you don't want to share.
      render: text
  - type: input
    id: hyprland
    attributes:
      label: Hyprland version
      description: Output of `hyprctl version | head -1`
    validations:
      required: true
  - type: input
    id: hyprstate
    attributes:
      label: hyprstate version or commit
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: Arch, Omarchy, NixOS, …
