name: Feature request
description: Suggest something hyprstate should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the "Not in scope" section of the README first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why doesn't hyprstate cover it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working (commands, config, output).
