[package]
name = "hyprstate"
version = "0.1.0"
edition = "2024"
description = "Save and restore your Hyprland desktop: snapshots, diffs and idempotent restores of windows and workspaces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flaviomilan/hyprstate"
readme = "README.md"
keywords = ["hyprland", "wayland", "session", "workspace", "restore"]
categories = ["command-line-utilities"]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# `cargo binstall hyprstate` downloads the release binary instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
